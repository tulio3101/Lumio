name: Deploy dev

# Al hacer merge (push) a develop: pruebas -> imagen arm64 en ECR -> despliegue en la EC2 por SSM.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Un despliegue a la vez: si llegan dos merges seguidos, el segundo espera al primero.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

# Valores NO secretos; salen de los outputs del stack lumio-dev (CloudFormation).
env:
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::685570574096:role/lumio-github-deploy-dev
  ECR_REPOSITORY: lumio-api
  EC2_INSTANCE_ID: i-02d2e27b29c2193e4
  API_URL: https://32.195.93.230.sslip.io

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # permite pedirle a GitHub el token OIDC para entrar a AWS
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: exists
        name: Revisar si la imagen de este commit ya existe
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v4

      - if: steps.exists.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - if: steps.exists.outputs.skip == 'false'
        name: Construir y subir la imagen arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Desplegar en la EC2 (SSM Run Command)
        run: |
          # El repo es privado: la EC2 no puede descargar de GitHub, así que los
          # archivos de deploy/ viajan dentro del comando, comprimidos en base64.
          bundle=$(tar -czf - -C deploy docker-compose.yml Caddyfile deploy.sh | base64 -w0)
          jq -n --arg bundle "$bundle" --arg sha "$GITHUB_SHA" '{
            commands: [
              "set -e",
              "mkdir -p /opt/lumio && cd /opt/lumio",
              ("echo " + $bundle + " | base64 -d | tar -xzf -"),
              ("bash deploy.sh " + $sha)
            ],
            executionTimeout: ["600"]
          }' > ssm-params.json

          cmd_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Lumio deploy ${GITHUB_SHA::7}" \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "Comando SSM: $cmd_id"

          status=Pending
          for _ in $(seq 1 60); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          echo "::group::Salida del despliegue en la EC2"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"

          echo "Estado final: $status"
          test "$status" = "Success"

      - name: Verificar la API desde internet
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$API_URL/health"